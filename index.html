<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="小兵重来" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>小兵重来 · Grunt Reborn</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1408; overscroll-behavior: none; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      /* 全屏的唯一来源：fixed + inset:0 跟随真实视口，不依赖 vh/dvh */
      #game { position: fixed; inset: 0; overflow: hidden; background: #1a1408; }
      /* 约定：任何全屏页面/覆盖层都挂到 #game 下并标记 .screen，自动铺满，不再各写一套尺寸 */
      #game > .screen { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
